<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft AI Bot Kontrol Paneli</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 15px; display: flex; gap: 15px; height: 100vh; overflow: hidden; }
    
    /* Sol Panel */
    .left-panel { flex: 1; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
    .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 6px; padding: 12px; }
    h2 { font-size: 12px; color: #38bdf8; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
    
    .form-group { margin-bottom: 8px; }
    .form-group label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 3px; }
    .form-group input, .form-group select { width: 100%; padding: 7px 9px; background-color: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 4px; outline: none; font-size: 12px; }
    .form-group input:focus, .form-group select:focus { border-color: #38bdf8; }
    .form-row { display: flex; gap: 8px; }

    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 12px; }
    .stat-item { background-color: #0f172a; padding: 8px; border-radius: 4px; border: 1px solid #334155; }
    .stat-value { font-weight: bold; color: #e2e8f0; }

    .cmd-box { display: flex; gap: 8px; margin-top: 5px; }
    button { padding: 8px 12px; background-color: #0284c7; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; transition: background 0.2s; }
    button:hover { background-color: #0369a1; }
    button.btn-connect { background-color: #16a34a; width: 100%; margin-top: 4px; }
    button.btn-connect:hover { background-color: #15803d; }
    button.btn-disconnect { background-color: #475569; width: 100%; margin-top: 4px; }
    button.btn-disconnect:hover { background-color: #334155; }
    button.stop-btn { background-color: #dc2626; width: 100%; margin-top: 6px; }
    button.stop-btn:hover { background-color: #b91c1c; }

    /* Sağ Panel (Terminal & Konsol) */
    .right-panel { flex: 1.8; background-color: #1e293b; border: 1px solid #334155; border-radius: 6px; display: flex; flex-direction: column; padding: 12px; overflow: hidden; }
    #logs { flex: 1; background-color: #020617; border: 1px solid #334155; padding: 10px; overflow-y: auto; font-size: 12px; font-family: 'Courier New', Courier, monospace; border-radius: 4px 4px 0 0; }
    
    /* Terminal Yazı Yazma Alanı */
    .terminal-input-container { display: flex; background-color: #020617; border: 1px solid #334155; border-top: none; border-radius: 0 0 4px 4px; padding: 6px; gap: 8px; }
    .terminal-input-container input { flex: 1; background-color: #0f172a; border: 1px solid #334155; color: #38bdf8; padding: 8px 10px; font-family: monospace; font-size: 13px; border-radius: 4px; outline: none; }
    .terminal-input-container input:focus { border-color: #0284c7; }

    .log-line { margin-bottom: 4px; word-break: break-all; line-height: 1.3; }
    .log-SYSTEM { color: #38bdf8; }
    .log-AI { color: #c084fc; }
    .log-ACTION { color: #60a5fa; }
    .log-SUCCESS { color: #4ade80; }
    .log-WARNING { color: #facc15; }
    .log-ERROR { color: #f87171; }
    .log-GAME_CHAT { color: #94a3b8; }
    .log-TERMINAL_SENT { color: #e0e7ff; font-weight: bold; }
    
    .status-badge { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background-color: #ef4444; margin-left: 5px; }
    .status-badge.online { background-color: #22c55e; }
  </style>
</head>
<body>

  <!-- Sol Panel (Ayarlar & Durum) -->
  <div class="left-panel">
    
    <div class="card">
      <h2>Sunucu & API Ayarları</h2>
      <div class="form-group">
        <label>Gemini API Key</label>
        <input type="password" id="apiKey" placeholder="AIzaSy..." />
      </div>
      <div class="form-row">
        <div class="form-group" style="flex: 2;">
          <label>Sunucu IP / Host</label>
          <input type="text" id="host" value="localhost" />
        </div>
        <div class="form-group" style="flex: 1;">
          <label>Port</label>
          <input type="text" id="port" value="25565" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group" style="flex: 1;">
          <label>Minecraft Sürümü</label>
          <select id="version">
            <option value="auto">Otomatik Tespit</option>
            <option value="1.20.6">1.20.6</option>
            <option value="1.20.4">1.20.4</option>
            <option value="1.20.1">1.20.1</option>
            <option value="1.19.4">1.19.4</option>
            <option value="1.18.2">1.18.2</option>
            <option value="1.16.5">1.16.5</option>
          </select>
        </div>
        <div class="form-group" style="flex: 1;">
          <label>Hesap Modu</label>
          <select id="auth">
            <option value="offline">Offline (Korsan/Crack)</option>
            <option value="microsoft">Microsoft (Orijinal)</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Bot Kullanıcı Adı</label>
        <input type="text" id="username" value="DynamicGeminiBot" />
      </div>
      <button class="btn-connect" onclick="startBot()">Sunucuya Bağlan</button>
      <button class="btn-disconnect" onclick="disconnectBot()">Bağlantıyı Kes</button>
    </div>

    <div class="card">
      <h2>Bot Durumu <span id="statusBadge" class="status-badge"></span></h2>
      <div class="stat-grid">
        <div class="stat-item">Can: <span id="health" class="stat-value">-</span>/20</div>
        <div class="stat-item">Açlık: <span id="food" class="stat-value">-</span>/20</div>
        <div class="stat-item" style="grid-column: span 2;">Konum: <span id="pos" class="stat-value">X: - Y: - Z: -</span></div>
      </div>
    </div>

    <div class="card">
      <h2>AI Komut Alanı</h2>
      <div class="cmd-box">
        <input type="text" id="cmdInput" placeholder="Örn: Ağaç kes, maden yap..." onkeydown="if(event.key==='Enter') sendCommand()" />
        <button onclick="sendCommand()">AI'ya Ver</button>
      </div>
      <button class="stop-btn" onclick="stopBot()">ACİL DURDUR</button>
    </div>

  </div>

  <!-- Sağ Panel (Konsol ve Doğrudan Terminal Chat) -->
  <div class="right-panel">
    <h2>CANLI TERMINAL VE OYUN KONSOLU</h2>
    <div id="logs"></div>
    
    <!-- Doğrudan Terminal Input Alanı -->
    <div class="terminal-input-container">
      <input type="text" id="terminalInput" placeholder="Sunucuya veya Sohbete Komut Gönder (Örn: /login 123456 veya Sa)..." onkeydown="if(event.key==='Enter') sendTerminalChat()" />
      <button onclick="sendTerminalChat()">Gönder</button>
    </div>
  </div>

  <script>
    const socket = io();

    function startBot() {
      const config = {
        apiKey: document.getElementById('apiKey').value.trim(),
        host: document.getElementById('host').value.trim(),
        port: document.getElementById('port').value.trim(),
        version: document.getElementById('version').value,
        auth: document.getElementById('auth').value,
        username: document.getElementById('username').value.trim()
      };

      if (!config.host) {
        alert("Lütfen Sunucu IP adresini girin!");
        return;
      }

      socket.emit('start_bot', config);
    }

    function disconnectBot() {
      socket.emit('disconnect_bot');
    }

    // Doğrudan Oyuna Komut/Sohbet Gönderme
    function sendTerminalChat() {
      const input = document.getElementById('terminalInput');
      if (input.value.trim() !== '') {
        socket.emit('send_terminal_chat', { message: input.value });
        input.value = '';
      }
    }

    function sendCommand() {
      const input = document.getElementById('cmdInput');
      if (input.value.trim() !== '') {
        socket.emit('send_command', { command: input.value });
        input.value = '';
      }
    }

    function stopBot() {
      socket.emit('stop_all');
    }

    socket.on('status_update', (data) => {
      const badge = document.getElementById('statusBadge');
      if (data.connected) {
        badge.classList.add('online');
        document.getElementById('health').innerText = data.health;
        document.getElementById('food').innerText = data.food;
        document.getElementById('pos').innerText = `X: ${data.position.x} | Y: ${data.position.y} | Z: ${data.position.z}`;
      } else {
        badge.classList.remove('online');
        document.getElementById('health').innerText = '-';
        document.getElementById('food').innerText = '-';
        document.getElementById('pos').innerText = 'X: - Y: - Z: -';
      }
    });

    socket.on('bot_log', (data) => {
      const logsDiv = document.getElementById('logs');
      const line = document.createElement('div');
      line.className = `log-line log-${data.type}`;
      line.innerText = `[${data.timestamp}] [${data.type}] ${data.message}`;
      logsDiv.appendChild(line);
      logsDiv.scrollTop = logsDiv.scrollHeight;
    });
  </script>
</body>
  </html>
